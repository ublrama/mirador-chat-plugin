services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ── LLM provider ──────────────────────────────────────────────────────
      # LiteLLM model string. Examples:
      #   OpenAI:     gpt-4o-mini  (default)
      #   OpenAI:     gpt-4o
      #   Anthropic:  anthropic/claude-3-haiku-20240307
      #   Ollama:     ollama/llama3
      #   Azure:      azure/<your-deployment-name>
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}

      # ── Provider credentials (set only the ones you need) ─────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AZURE_API_BASE=${AZURE_API_BASE:-}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-}

      # ── Ollama (local) ────────────────────────────────────────────────────
      # Point to your Ollama instance. Use host.docker.internal on Mac/Windows.
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}

      # ── Optional: verbose LiteLLM logging ────────────────────────────────
      - LITELLM_VERBOSE=${LITELLM_VERBOSE:-false}

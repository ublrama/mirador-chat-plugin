services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ── LLM provider ──────────────────────────────────────────────────────
      # LiteLLM model string. Examples:
      #   OpenAI:     gpt-4o-mini  (default)
      #   OpenAI:     gpt-4o
      #   Anthropic:  anthropic/claude-3-haiku-20240307
      #   Azure:      azure/<your-deployment-name>
      # Ignored when USE_OLLAMA=true (OLLAMA_MODEL is used instead).
      - LLM_MODEL=${LLM_MODEL:-gpt-5.4-mini}

      # ── Containerised Ollama ──────────────────────────────────────────────
      # Set USE_OLLAMA=true and COMPOSE_PROFILES=ollama in .env to spin up
      # the Ollama service defined below and route requests to it.
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}

      # ── Provider credentials (set only the ones you need) ─────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - AZURE_API_BASE=${AZURE_API_BASE:-}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-}

      # ── Ollama base URL ───────────────────────────────────────────────────
      # When USE_OLLAMA=true the backend defaults to http://ollama:11434.
      # Override here for an external Ollama instance.
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}

      # ── Optional: verbose LiteLLM logging ────────────────────────────────
      - LITELLM_VERBOSE=${LITELLM_VERBOSE:-false}

  # ── Ollama container (only started when COMPOSE_PROFILES=ollama) ───────────
  # The container starts the Ollama server, then pulls OLLAMA_MODEL on first
  # start. Model weights are persisted in the ollama_data volume so subsequent
  # restarts skip the download.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        until /bin/ollama list > /dev/null 2>&1; do sleep 2; done
        echo "Ollama ready — pulling $${OLLAMA_MODEL:-gemma4:e2b} ..."
        /bin/ollama pull $${OLLAMA_MODEL:-gemma4:e2b}
        echo "Model pull complete."
        wait

volumes:
  ollama_data:
